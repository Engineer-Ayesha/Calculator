<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet"  href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <section id="calculator">
        <div id="navbar">
            <h2>Calculator</h2>
        </div>
        <div id="main-container">
        <input id="inputField" type="text" placeholder="0">
        <div id="input-container">
            <div id="first-row">
                <div class="inputs" id="clear">AC</div>
                <div class="inputs" id="leftClear">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
                <div class="inputs" id="divide">/</div>
            </div>
            <div id="second-row">
                <div class="inputs">7</div>
                <div class="inputs">8</div>
                <div class="inputs">9</div>
                <div class="inputs" id="multiply">*</div>
            </div>
            <div id="third-row">
                <div class="inputs">4</div>
                <div class="inputs">5</div>
                <div class="inputs">6</div>
                <div class="inputs" id="subtract">-</div>
            </div>
            <div id="fourth-row">
                <div class="inputs">1</div>
                <div class="inputs">2</div>
                <div class="inputs">3</div>
                <div class="inputs" id="add">+</div>
            </div>
            <div id="fifth-row">
                <div class="inputs" id="modulus">%</div>
                <div class="inputs">0</div>
                <div class="inputs">.</div>
                <div id="equal" class="inputs">=</div>
            </div> 
        </div>
    </div>
    </section>
    
    
</body>
<script src="calculator.js"></script>
</html>
